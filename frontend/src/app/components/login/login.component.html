<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Log in to access your scholarship recommendations</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="name@university.edu"
            required
            #emailInput="ngModel"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required
            #passwordInput="ngModel"
          />
        </div>
      </div>

      <button type="submit" [disabled]="!loginForm.form.valid" class="btn-submit">
        Sign In
      </button>

      <div class="error-container" *ngIf="errorMessage">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Create an account</a></p>
      </div>
    </form>
  </div>
</div>
