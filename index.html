<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Car</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <form>
        <div>
             <label for="fname">Firstname :</label>
             <input type="text" id="Username" maxlength="9" placeholder="John The great">
        </div>    
        <br>
        <div>
        <label for="lname">Lastname :</label>
        <input type="text" id="Lastname" maxlength="8" placdholder="Lioenal">
        </div>
        <br>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" maxlength="8" placeholder="********">
        </div>
        <br>
        <div>
            <label for="tel">contact no :</label>
            <input type="tel" id="tel" maxlength="10">
        </div>
        <div>
            <label>Gender :</label>
            <label for="Man">Man</label>
            <input type="radio" name="Gender" id="Man" value="Man">


            <label for="Woman">Woman</label>
            <input type="radio" id="Woman" name="Gender" value="Woman">
            <br>
        </div>
        <br>
        <div>
            <label for="Accept terms">Accept terms</label>
            <input type="checkbox" id="checkbox" value="Checkbox">
        </div>
        <br>
        <div>
            <label for="payment">Payment :</label>
            <select id="Payment" name="Payment">
            <option value="Gpay">Gpay</option>
            <option value="PhonePay">PhonePay</option>
            <option value="Fanpay">Fanpay</option>
            </select>
        </div>
        <button href="https://www.instagram.com/">Submit</button>

    </form>
    
</body>
</html>
