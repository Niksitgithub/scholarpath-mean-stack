<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>
    <link rel="stylesheet" href="home page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <script src="index.js"></script>
    <h1>Home Page</h1>

    <form action="your-server-endpoint" method="post">
        <div>
            <label for="fname">Username:</label>
            <input type="text" id="fname" maxlength="7" required>
        </div>
        <br>
        <div>
            <label for="lname">Lastname:</label>
            <input type="text" id="lname" maxlength="7" required>
        </div>
        <br>  
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" maxlength="12">
        </div>
        <br>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" maxlength="12" required>
        </div>
        <br>
        <div>
            <label for="tel">Phone:</label>
            <input type="tel" id="tel" maxlength="11">
        </div>
        <br>
        <div>
            <label for="birthday">DOB:</label>
            <input type="date" id="birthday">
        </div>
        <br>
        <div>
            <label>Gender:</label>

            <label for="Man">Man</label>
            <input type="radio" id="Man" name="Gender" value="Man">

            <label for="Woman">Woman</label>
            <input type="radio" id="Woman" name="Gender" value="Woman">

            <label for="NoPreference">No preference</label>
            <input type="radio" id="NoPreference" name="Gender" value="No preference">
        </div>
        <br>
        <div>
            <label for="checkbox">Accept Terms</label>
            <input type="checkbox" id="checkbox" name="Checkbox">
        </div>
        <br>
        <div>
            <label for="payment">Payment:</label>
            <select id="payment" name="Payment">
                <option value="Gpay">Gpay</option>
                <option value="Visa">Visa</option>
                <option value="MasterCard">Master Card</option>
            </select>
        </div>
        <br>
        <div>
            <input type="reset" value="Clear Form">
        </div>
        <br>
        <div>
            <input type="submit" value="Register">
        </div>
    </form>
</body>
</html>
